name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pyac
    steps:
      - uses: actions/checkout@v4
        with:
          path: pyac
      # The stack lives in usernet, which [tool.uv.sources] resolves from
      # ../usernet. Until it is released anywhere, CI has to supply that
      # sibling itself -- and testing against the tip of it is what catches a
      # breaking change there on the commit that caused it rather than later.
      - uses: actions/checkout@v4
        with:
          repository: dehesselle/usernet
          path: usernet
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # The conformance suite that used to run here moved to usernet with the
      # stack it validates. What is left is everything that is about CSTP.
      - run: uv run pytest -q -m "not needs_gateway"
