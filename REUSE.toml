version = 1

# Files that can't carry an SPDX comment, or shouldn't: docs stay clean when
# rendered, the corpus is test input for the parsers, and uv.lock is
# regenerated.
[[annotations]]
path = [
    "**.md",
    "tests/corpus/*.xml",
    "uv.lock",
    ".python-version",
]
