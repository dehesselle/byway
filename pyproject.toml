[project]
name = "pylis"
dynamic = ["version"]
description = "Userspace client that speaks the Cisco AnyConnect VPN protocol, with an in-process TCP/IP stack"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
dependencies = [
    "usernet[httpx]>=0.7",
    "httpx>=0.27,<0.29",
    "defusedxml>=0.7.1",
    "platformdirs>=4",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.scripts]
pylis = "pylis.cli.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "trustme>=1.1",         # self-signed certs for the fake gateway
    "usernet[testing]",     # TcpPeer and TlsHttpEndpoint for the fake gateway
    "keyring>=25",          # the [keyring] extra, so mypy sees its real types
]

# ---------------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "TID"]

# The sans-IO contract that used to be enforced here now lives in usernet,
# which owns the stack it applies to. Nothing left in this project is sans-IO:
# the auth client speaks HTTP, the CSTP session owns a TLS connection, and the
# codecs beneath them are pure but have no import to ban.

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The protocol codecs carry the correctness risk and have no untyped
# third-party surface, so they get the strict treatment.
module = ["pylis.cstp.*"]
strict = true

[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Non-negotiable: a broken TCP stack hangs forever and would otherwise wedge CI.
timeout = 30
addopts = "--strict-markers"
markers = [
    "slow: takes more than a second",
    "needs_gateway: requires a real VPN gateway (never runs in CI)",
]

[tool.coverage.run]
source = ["pylis"]
branch = true
